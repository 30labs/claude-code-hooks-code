[project]
name = "claude-code-hooks"
version = "0.1.0"
description = "Code companion for Hooks in Python for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".claude/hooks", "tests/hooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff]
src = [".claude/hooks", "tests/hooks"]

[tool.mypy]
mypy_path = [".claude/hooks", "scripts", "tests/hooks"]
